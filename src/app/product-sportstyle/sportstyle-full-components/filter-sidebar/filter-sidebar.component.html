<div class="flex flex-col gap-2 bg-[#f6f6f6] w-[260px] p-[10px]">
  <div class="flex flex-col bg-[#fff] p-[15px]">
    <div
      class="flex justify-between items-center px-[5px] h-[20px] cursor-pointer !mb-[10px]"
      (click)="onClickMark()"
    >
      <span class="text-[14px]">Marca</span>
      <span class="span-brand-dash" *ngIf="!wasClickedMark">-</span>
      <span class="span-brand-dash" *ngIf="wasClickedMark">+</span>
    </div>
    <div class="container-input-search">
      <input type="text" class="text-[14px] w-full p-[11px] outline-none" />
      <div class="container-magnifying-glass">
        <app-magnifying-glass-brand-svg></app-magnifying-glass-brand-svg>
      </div>
    </div>
    <!-- <input type="text"> -->
    <div class="container-main-checkbox">
      <div class="form-check" *ngFor="let el of arrayBrandsToFilter">
        <input class="form-check-input" type="checkbox" id="brandAdidas" />
        <label class="form-check-label small-label" for="brandAdidas">{{ el }}</label>
      </div>
    </div>
  </div>

  <div class="flex flex-col bg-[#fff] p-[15px]">
    <div
      class="flex justify-between items-center px-[5px] h-[20px] cursor-pointer !mb-[10px]"
      (click)="onClickMark()"
    >
      <span class="text-[14px]">Tamanho</span>
      <span class="span-brand-dash" *ngIf="!wasClickedMark">-</span>
      <span class="span-brand-dash" *ngIf="wasClickedMark">+</span>
    </div>
    <div class="container-input-search">
      <input type="text" class="text-[14px] w-full p-[11px] outline-none" />
      <div class="container-magnifying-glass">
        <app-magnifying-glass-brand-svg></app-magnifying-glass-brand-svg>
      </div>
    </div>
    <!-- <input type="text"> -->
    <div class="container-main-size">
      <div class="container-size" *ngFor="let size of arraySizesProduct">
        <div
          class="border-1 border-gray-custom rounded-sm container-size d-flex justify-content-center align-items-center"
        >
          {{ size }}
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex flex-column gap-2">
    <div class="container-color-main-and-bottom-part">
      <div
        class="d-flex justify-content-between align-items-start cursor-pointer h-[24px]"
        #containerMainColor
        (click)="
          onClickContainerColorMain(
            containerColorMain,
            minusColorMain,
            moreColorMain,
            inputTypingColors,
            containerMainColor
          )
        "
      >
        <span class="span-size">Cor Principal</span>
        <span class="fw-bold" #moreColorMain>+</span>
        <span class="fw-bold span-minus-color-main" #minusColorMain>-</span>
      </div>
      <div class="container-color-main" #containerColorMain>
        <div class="container-input-search-main-color">
          <input
            type="text"
            class="text-[14px] w-full p-[11px] outline-none"
            #inputTypingColors
            (input)="onTyping($event)"
          />
          <div class="container-magnifying-glass">
            <app-magnifying-glass-brand-svg></app-magnifying-glass-brand-svg>
          </div>
        </div>

        <div class="container-color-height-adjust">
          <ng-container *ngIf="!arrayColorsProductFilter">
            <div class="container-check-color" *ngFor="let el of arrayColorsProduct">
              <input class="form-check-input" type="checkbox" [id]="'color-' + el" />
              <label class="form-check-label text-[14px]" [for]="'color-' + el">{{ el }}</label>
            </div>
          </ng-container>

          <ng-container *ngIf="arrayColorsProductFilter !== null">
            <div class="container-check-color" *ngFor="let el of arrayColorsProductFilter">
              <input class="form-check-input" type="checkbox" [id]="'color-' + el" />
              <label class="form-check-label text-[14px]" [for]="'color-' + el">{{ el }}</label>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    <div class="container-color-main-and-bottom-part">
      <div class="d-flex justify-content-between align-items-start cursor-pointer h-[24px]">
        <span class="span-size">Preço</span>
        <span class="fw-bold">+</span>
      </div>
    </div>
  </div>
</div>
